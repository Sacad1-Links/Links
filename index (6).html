<style>
:root{
  --bg:#06150e; --bg2:#0c2418; --cash:#3fae66; --ice:#d6ecff; --gold:#f3c552; --text:#f2f7f4; --muted:#9db8a8;
  --display:"Bowlby One","Arial Black",Impact,sans-serif; --body:"Outfit","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:var(--body); color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(60% 40% at 50% 0%, rgba(214,236,255,.14), transparent 70%),
    radial-gradient(50% 35% at 50% 100%, rgba(63,174,102,.22), transparent 70%),
    repeating-linear-gradient(135deg, rgba(63,174,102,.05) 0 2px, transparent 2px 22px);
  background-attachment:fixed;
  display:flex; justify-content:center; padding:48px 20px 40px;
}
main{width:100%; max-width:440px; text-align:center}

.avatar{position:relative; width:150px; height:150px; margin:0 auto 22px}
.avatar img{
  width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 20%;
  border:4px solid var(--gold); box-shadow:0 0 0 4px rgba(243,197,82,.2), 0 10px 40px rgba(214,236,255,.25);
  background:var(--bg2);
}
.spark{position:absolute; width:18px; height:18px; background:var(--ice);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); opacity:0; animation:twinkle 2.4s ease-in-out infinite}
.s1{top:-6px; right:4px}
.s2{bottom:18px; left:-10px; width:13px; height:13px; animation-delay:.8s}
.s3{bottom:-4px; right:14px; width:10px; height:10px; animation-delay:1.5s}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4) rotate(0)}50%{opacity:1; transform:scale(1) rotate(45deg)}}

h1{
  font-family:var(--display); font-weight:400; font-size:clamp(2rem,9vw,2.6rem); line-height:1.1; letter-spacing:.5px;
  background:linear-gradient(180deg,#fff 0%,var(--ice) 45%,#8fb4d1 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
}
.desc{margin:14px auto 30px; max-width:32ch; color:var(--muted); font-size:1.05rem; line-height:1.5}

.links{list-style:none; padding:0; display:grid; gap:14px}
.link{
  position:relative; overflow:hidden; display:flex; align-items:center; gap:16px;
  padding:14px 18px; border-radius:16px; text-decoration:none; color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1.5px solid rgba(214,236,255,.28);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  font-weight:700; font-size:1.15rem; text-align:left;
  transition:transform .15s ease, border-color .15s ease;
}
.link::after{
  content:""; position:absolute; inset:0; transform:translateX(-120%);
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
  transition:transform .6s ease;
}
.link:hover,.link:focus-visible{transform:translateY(-3px); border-color:var(--gold)}
.link:hover::after,.link:focus-visible::after{transform:translateX(120%)}
.link:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.icon{flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center}
.icon svg{width:24px; height:24px; fill:#fff}
.yt .icon{background:#ff0033}
.tw .icon{background:#9146ff}
.dc .icon{background:#5865f2}
.tt .icon{background:#000; box-shadow:inset 2px 0 0 #25f4ee, inset -2px 0 0 #fe2c55}
.label{flex:1}

footer{margin-top:34px; color:var(--muted); font-size:.9rem}
@media (prefers-reduced-motion:reduce){.spark{animation:none; opacity:.9} .link,.link::after{transition:none}}
</style>
